name: Assemble verified public EP10 ZIP archives
on:
  push:
    branches: [main]
    paths:
      - 'R21R8_EP10_PUBLIC/parts/**'
      - 'R21R8_EP10_PUBLIC/SHA256_EXPECTED.json'
      - '.github/workflows/assemble-ep10-public.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild available public ZIPs and verify exact SHA256
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          base=pathlib.Path('R21R8_EP10_PUBLIC')
          spec=json.loads((base/'SHA256_EXPECTED.json').read_text())
          completed=[]
          for v in spec['files']:
              parts=[base/'parts'/(v['file']+'.part'+str(i).zfill(3)) for i in range(v['part_count'])]
              if not all(p.is_file() for p in parts):
                  print('PENDING_PARTS',v['file'],sum(p.is_file() for p in parts),'/',len(parts))
                  continue
              target=base/v['file']
              with target.open('wb') as f:
                  for p in parts:f.write(p.read_bytes())
              body=target.read_bytes()
              assert len(body)==v['size_bytes'],('BYTE_COUNT_MISMATCH',v['file'])
              assert hashlib.sha256(body).hexdigest()==v['sha256'],('SHA256_MISMATCH',v['file'])
              with zipfile.ZipFile(target) as z:
                  assert z.testzip() is None,('ZIP_CRC_FAILURE',v['file'])
                  names=z.namelist()
                  assert 'README_PUBLIC_SCOPE_AND_RIGHTS.md' in names
                  import json as _json
                  m=_json.loads(z.read('MANIFEST_SHA256.json'))
                  for k,meta in m.items():
                      assert hashlib.sha256(z.read(k)).hexdigest()==meta['sha256'],('INNER_HASH_MISMATCH',k)
              print('VERIFIED_PUBLIC_ARCHIVE',v['file'],v['sha256'],len(m))
              completed.append(v['file'])
          (base/'ARCHIVE_VERIFICATION.json').write_text(json.dumps({'verified_zip_files':completed,'expected_files':[v['file'] for v in spec['files']]},indent=2)+'\n')
          assert completed, 'NO_ARCHIVE_HAS_ALL_PARTS'
          PY
      - name: Commit verified binary ZIP archives to public repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add R21R8_EP10_PUBLIC/*.zip R21R8_EP10_PUBLIC/ARCHIVE_VERIFICATION.json
          if ! git diff --cached --quiet; then
            git commit -m 'release: publish verified EP10 public research ZIP archives'
            git push
          fi
