name: FFLS bibliographic metadata readback
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/ffls-metadata-readback.yml]
permissions: {}
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public bibliographic endpoints
        run: |
          python3 - <<'PY'
          import urllib.request, json, re
          doi = '10.1109/ACCESS.2026.3742651'
          urls = {'crossref':'https://api.crossref.org/works/'+doi,
                  'openalex':'https://api.openalex.org/works/https://doi.org/'+doi,
                  'publisher':'https://ieeexplore.ieee.org/document/11733759'}
          for name, url in urls.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 bibliographic-metadata verification'})
                  with urllib.request.urlopen(req,timeout=25) as res:
                      data=res.read()
                      print(name,'HTTP',res.status,'bytes',len(data),'final URL',res.url,flush=True)
                  if name=='crossref':
                      m=json.loads(data)['message']
                      print(json.dumps({k:m.get(k) for k in ['DOI','title','container-title','author','published','published-online','volume','issue','page','article-number','URL']},ensure_ascii=False),flush=True)
                  elif name=='openalex':
                      m=json.loads(data)
                      print(json.dumps({k:m.get(k) for k in ['doi','title','publication_date','biblio','primary_location']},ensure_ascii=False),flush=True)
                  else:
                      s=data.decode(errors='replace')
                      for tag in re.findall(r'<meta[^>]+(?:citation_|dc\.)[^>]+>',s,re.I):
                          print(tag[:1000],flush=True)
              except Exception as exc:
                  print(name,'UNVERIFIED',repr(exc),flush=True)
          PY
